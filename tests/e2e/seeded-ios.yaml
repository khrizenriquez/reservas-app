appId: host.exp.Exponent
---
- runFlow:
    when:
      visible: "Iniciar sesión"
    commands:
      - setClipboard: "docente.demo01@umg.edu.gt"
      - tapOn:
          id: "login-email"
      - eraseText
      - pasteText
      - pressKey: Enter
      - setClipboard: ${MAESTRO_DEMO_PASSWORD}
      - eraseText
      - pasteText
      - pressKey: Enter
- tapOn:
    text: "Not Now"
    optional: true
- tapOn: "Inicio"
- extendedWaitUntil:
    visible: "Hola, Docente"
    timeout: 20000
- assertVisible: ".* activas"
- tapOn: "Reservas"
- scrollUntilVisible:
    element:
      text: "Historial y seguimiento"
    direction: UP
- assertVisible: "Activas"
- tapOn: "Disponible"
- assertVisible: "Disponibilidad"
- tapOn: "Perfil"
- assertVisible: ${MAESTRO_EXPECTED_PROFILE}
- assertVisible: "Cambiar contraseña"
